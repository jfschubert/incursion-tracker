# Publishes the tracker to GitHub Pages and creates a GitHub release.
#
#   Tag push "1.2.3" or "v1.2.3" -> deploy to Pages, create the release (with a zip for self-hosting)
#   Manual run                    -> deploy to Pages only (no release)
#
# The tag is the version: it is written into js/config.js of the deployed page and the zip, so there is
# no version bump to commit. VERSION in the repository is only what local copies show.
# Repository settings -> Pages -> Source must be set to "GitHub Actions".
name: release

on:
  push:
    tags: ["v[0-9]*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in js/*.js; do echo "$f"; node --input-type=module --check < "$f"; done
      - name: Version
        id: version
        # from the tag (leading "v" optional); manual runs keep VERSION from js/config.js
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag ${GITHUB_REF_NAME} is not a version like 1.2.3"; exit 1; }
          else
            v=$(sed -n "s/^export const VERSION = '\([^']*\)'.*/\1/p" js/config.js)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"
      - uses: actions/configure-pages@v5
        id: pages
      - name: Assemble site
        # only the files the page needs – no IDE or repo files on Pages
        run: |
          for d in _site _zip; do
            mkdir -p $d && cp -r index.html icon.svg css js $d/
            [ -f LICENSE ] && cp LICENSE $d/ || true
            sed -i "s|^export const VERSION = '.*';|export const VERSION = '${{ steps.version.outputs.version }}';|" $d/js/config.js
            grep -q "^export const VERSION = '${{ steps.version.outputs.version }}';" $d/js/config.js || { echo "::error::could not set VERSION"; exit 1; }
          done
      - name: Inject built-in ESI application
        # Client ID from the repository variable ESI_CLIENT_ID (Settings -> Secrets and variables ->
        # Actions -> Variables), or a secret of the same name. It is public in the deployed page
        # anyway (PKCE login, no secret involved) – this only keeps it out of git.
        # Without it, the hosted page asks users for their own Client ID.
        env:
          CLIENT_ID: ${{ vars.ESI_CLIENT_ID || secrets.ESI_CLIENT_ID }}
          PAGE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::warning::ESI_CLIENT_ID is not set – the hosted page will ask users for their own Client ID"; exit 0
          fi
          [[ "$CLIENT_ID" =~ ^[A-Za-z0-9-]+$ ]] || { echo "::error::ESI_CLIENT_ID contains unexpected characters"; exit 1; }
          sed -i "s|^export const DEFAULT_CLIENT_ID = '.*';|export const DEFAULT_CLIENT_ID = '$CLIENT_ID';|; s|^export const DEFAULT_REDIRECT = '.*';|export const DEFAULT_REDIRECT = '$PAGE_URL';|" _site/js/config.js
          grep -q "DEFAULT_REDIRECT = '$PAGE_URL'" _site/js/config.js || { echo "::error::could not inject into js/config.js"; exit 1; }
          echo "Built-in ESI application set up for $PAGE_URL – register this exact callback URL"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Zip for self-hosting
        # _zip has the version but not the hosted Client ID (it would not work elsewhere)
        run: |
          cd _zip && zip -r "../incursion-tracker-${{ steps.version.outputs.version }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: incursion-tracker-zip
          path: incursion-tracker-*.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.ref_type == 'tag'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: incursion-tracker-zip
      - name: Release notes
        run: |
          cat > notes.md <<EOF
          **Use it online:** ${{ needs.deploy.outputs.page_url }}

          **Self-hosting:** unzip, serve the folder (e.g. \`python -m http.server 8080\`), register your own ESI application with the callback \`http://localhost:8080/\` and enter its Client ID in Settings.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: Incursion Tracker ${{ needs.build.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: incursion-tracker-*.zip
